function refreshManagedSamples(){const brand=document.getElementById('manageBrand')?.value,select=document.getElementById('manageSample');if(!select)return;const previous=select.value,names=[...new Set(samples.filter(s=>s.brand===brand).map(s=>s.name))].sort((a,b)=>a.localeCompare(b,'ko'));select.innerHTML=names.length?'<option value="">샘플 선택</option>'+names.map(name=>{const item=samples.find(s=>s.brand===brand&&s.name===name);return '<option value="'+h(item.code)+'">'+h(name)+'</option>'}).join(''):'<option value="">등록된 샘플이 없습니다</option>';if(previous&&names.length&&[...select.options].some(o=>o.value===previous))select.value=previous;document.getElementById('editManagedButton').disabled=!select.value}

function saveSample(e,oldCode){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),existing=samples.find(s=>s.code===oldCode);if(existing&&!canEdit(existing)){toast('이 브랜드를 수정할 권한이 없습니다.');return}if(!existing&&current.role!=='관리자'&&d.brand!==current.brand){toast('담당 브랜드 샘플만 등록할 수 있습니다.');return}let obj={...existing,...d,code:existing?.code||('item-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)),progress:existing&&d.status==='재시화'?existing.progress:Number(d.progress),date:existing?.date||new Date().toISOString().slice(0,10)};if(existing){if(existing.name!==obj.name||existing.brand!==obj.brand){books=books.map(b=>b.brand===existing.brand&&(b.sample===existing.name||(!b.sample&&b.title===existing.name))?{...b,brand:obj.brand,sample:obj.name,title:obj.name}:b)}samples=samples.map(s=>s.code===oldCode?obj:s)}else samples.unshift(obj);persist();closeModal();render();toast('샘플 정보가 저장되었습니다.')}function openBooking(){const timeOptions=Array.from({length:23},(_,n)=>{const i=n+15,hh=String(Math.floor(i/2)).padStart(2,'0'),mm=i%2?'30':'00',time=hh+':'+mm;return '<option value="'+time+'">'+time+'</option>'}).join(''),bookingBrand=filterBrand!=='전체'?filterBrand:'K2',brandOptions=BRANDS.map(v=>'<option value="'+h(v)+'"'+(v===bookingBrand?' selected':'')+'>'+h(v)+'</option>').join(''),statuses=['1차 어프로발','2차 어프로발','3차 어프로발','CFM 어프로발','생산시화','재시화'];document.getElementById('modal').innerHTML='<div class="modal"><div class="modal-top"><h2>샘플 미팅 예약</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveBooking(event)"><div class="formgrid"><div class="formrow"><label>브랜드</label><select name="brand" onchange="refreshBookingSamples()" required>'+brandOptions+'</select></div><div class="formrow"><label>샘플명</label><select name="sample" id="bookingSample" required></select></div><div class="formrow"><label>진행 상태</label><select name="status" required>'+statuses.map(v=>'<option>'+h(v)+'</option>').join('')+'</select></div><div class="formro function refreshBookingSamples(){const brand=document.querySelector('#modal select[name="brand"]')?.value,select=document.getElementById('bookingSample');if(!select)return;const names=[...new Set(samples.filter(s=>s.brand===brand).map(s=>s.name))].sort((a,b)=>a.localeCompare(b,'ko'));select.innerHTML=names.length?'<option value="">샘플 선택</option>'+names.map(name=>'<option value="'+h(name)+'">'+h(name)+'</option>').join(''):'<option value="">등록된 샘플이 없습니다. 샘플을 먼저 등록해 주세요.</option>';select.disabled=!names.length}function completeBooking(index){const booking=books[index];if(!booking||booking.completed)return;booking.completed=true;booking.completedAt=new Date().toISOString();if(booking.status){samples=samples.map(s=>s.brand===booking.brand&&s.name===(booking.sample||booking.title)?{...s,status:booking.status}:s)}persist();render();toast('미팅 완료 및 샘플 진행 상태를 갱신했습니다.')}function saveBooking(e){e.preventDefault();let booking=Object.fromEntries(new FormData(e.target));if(books.some(b=>b.date===booking.date&&b.time===booking.time)){toast('해당 시간에 이미 예약된 미팅이 있습니다. 다른 시간을 선택해 주세요.');return}booking.id='meeting-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);booking.title=booking.sample;books.push(booking);persist();closeModal();render();toast('미팅이 예약되었습니다.')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function openResetDialog(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modal-top"><h2>전체 데이터 리셋</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="confirmReset(event)"><div class="formrow"><label>시즌 등록</label><input name="season" value="${h(season)}" placeholder="예: 2026 FW" maxlength="30" required></div><div class="formrow" style="margin-top:12px"><label>비밀번호</label><input type="password" name="resetPassword" inputmode="numeric" placeholder="비밀번호 입력" autocomplete="off" required autofocus></div><p style="font-size:12px;color:#7d817b;margin:12px 0 0">전체 리셋과 함께 시즌을 등록합니다. 등록한 시즌은 K2 GROUP 아래에 표시됩니다.</p><div class="modal-actions"><button type="button" class="btn light" onclick="closeModal()">취소</button><button class="btn">리셋 실행</button></div></form></div>`;document.getElementById('modal').classList.add('show')}
async function confirmReset(e){e.preventDefault();const formData=new FormData(e.target),password=formData.get('resetPassword'),newSeason=String(formData.get('season')||'').trim();if(!newSeason){toast('시즌을 입력해 주세요.');return}if(isShared){try{const response=await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,season:newSeason})});if(response.status===403){toast('비밀번호가 올바르지 않습니다.');e.target.reset();e.target.querySelector('[name="resetPassword"]').focus();return}if(!response.ok)throw new Error()}catch{toast('공유 서버에 리셋 요청을 보내지 못했습니다.');return}}else{if(password!=='2015'){toast('비밀번호가 올바르지 않습니다.');e.target.reset();e.target.querySelector('[name="resetPassword"]').focus();return}}samples=[];books=[];season=newSeason;filterBrand='전체';filterStatus='전체';query='';if(!isShared){set('stitch_season',season);persist()}closeModal();render();toast(`샘플·미팅 데이터가 초기화되고 ${season} 시즌이 등록되었습니다.`)}function logout(){current=null;localStorage.removeItem('stitch_current');renderAuth()}render();loadSharedState();if(isShared)setInterval(refreshSharedState,4000);
</script></body></html>
